name: Vitra
options:
  bundleIdPrefix: com.rrobertf
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "2026110702"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Vitra:
    type: application
    platform: iOS
    sources:
      - path: Vitra
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rrobertf.vitra
        PRODUCT_NAME: Vitra
        INFOPLIST_FILE: Vitra/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      build:
        - Vitra
      archive:
        config: Release
